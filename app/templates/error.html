{% extends "base.html" %}
{% block title %}{{ error.code }} - Biomed EMS{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-4">{{ error.code }}</h1>
  <p class="lead">{{ error.name }}</p>
  <p class="text-muted">{{ error.description }}</p>
  <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">Back to dashboard</a>
</div>
{% endblock %}
